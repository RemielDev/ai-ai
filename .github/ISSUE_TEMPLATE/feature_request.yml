name: Feature request
description: An idea for AI-AI.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AI-AI doesn't help with today?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could AI-AI help? Sketch the UX if you can.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I'd be willing to send a PR for this
